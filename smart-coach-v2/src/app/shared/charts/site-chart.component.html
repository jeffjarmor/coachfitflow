@if (theme()) {
  <div echarts class="chart-canvas" [options]="options()" [initOpts]="initOptions" [autoResize]="true"></div>
} @else {
  <div class="chart-canvas skeleton" role="status" aria-label="Preparando gráfica"></div>
}
<details class="chart-data">
  <summary class="disclosure-summary">
    <span>Ver datos de la gráfica</span>
    <svg class="chart-data-caret disclosure-caret" width="24" height="15" viewBox="0 0 24 15" fill="none" aria-hidden="true" focusable="false"><path d="M1.99938 12.9093L12.0801 2.82861L21.9994 12.7479" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
  </summary>
  <table>
    <caption class="visually-hidden">{{ label() }}{{ currency() ? ' · ' + currency() : '' }}</caption>
    <thead><tr><th scope="col">Fecha</th><th scope="col">{{ label() }}</th></tr></thead>
    <tbody>
      @for (point of points(); track $index) {
        <tr><th scope="row">{{ point.label }}</th><td>{{ formatValue(point.value) }}</td></tr>
      }
    </tbody>
  </table>
</details>
