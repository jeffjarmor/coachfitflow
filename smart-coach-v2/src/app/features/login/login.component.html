<main class="auth-page login-page">
  <aside class="auth-visual login-visual" aria-label="Entrenamiento de fuerza">
    <picture>
      <source media="(min-width: 960px)" srcset="/images/auth/login-training.webp">
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Atleta preparándose para levantar una barra en el gimnasio" width="1200" height="800" fetchpriority="high">
    </picture>
  </aside>
  <div class="auth-workspace">
    <header class="auth-topbar">
      <a class="brand-link" routerLink="/" aria-label="Zummith, volver al inicio"><img src="/brand/zummith-horizontal.svg" alt="Zummith" width="160" height="45"></a>
      <a class="back-link" routerLink="/"><svg class="back-link-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="/icons/material-icons.svg#arrow-back"></use></svg> Inicio</a>
    </header>
    <section class="auth-panel login-panel" aria-labelledby="login-title">
      <div class="auth-heading">
        <h1 id="login-title">Inicia sesión.</h1>
        <p>Qué bueno verte de nuevo. Entra a tu espacio.</p>
      </div>
      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
      }
      @if (infoMessage()) {
        <div class="alert alert-success" role="status">{{ infoMessage() }}</div>
      }
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading()" novalidate>
        <div class="auth-field">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" id="email" type="email" autocomplete="email" inputmode="email" formControlName="email" placeholder="nombre@ejemplo.com"
            aria-describedby="login-email-error" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
          <div id="login-email-error" class="invalid-feedback">Ingresa un correo válido.</div>
        </div>
        <div class="auth-field">
          <div class="field-heading">
            <label class="form-label" for="password">Contraseña</label>
            <button class="recovery-link" type="button" (click)="recoverPassword()" [disabled]="loading()">¿La olvidaste?</button>
          </div>
          <div class="password-field">
            <input class="form-control" id="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" formControlName="password" placeholder="Tu contraseña"
              aria-describedby="login-password-error" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
            <button class="password-toggle" type="button" (click)="showPassword.set(!showPassword())" aria-controls="password" [attr.aria-pressed]="showPassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg class="auth-icon" aria-hidden="true" focusable="false"><use [attr.href]="'/icons/tabler-fitness.svg#' + (showPassword() ? 'eye-off' : 'eye')"></use></svg>
            </button>
          </div>
          <div id="login-password-error" class="invalid-feedback" [class.d-block]="form.controls.password.touched && form.controls.password.invalid">La contraseña debe tener al menos 8 caracteres.</div>
        </div>
        <button class="btn btn-primary w-100 auth-submit" type="submit" [disabled]="loading()">
          @if (loading()) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> }
          {{ loading() ? 'Ingresando' : 'Iniciar sesión' }}
          @if (!loading()) { <svg class="auth-icon" aria-hidden="true" focusable="false"><use href="/icons/tabler-fitness.svg#arrow-right"></use></svg> }
        </button>
      </form>
      <div class="auth-divider"><span>o continúa con</span></div>
      <button class="btn btn-outline-dark w-100 google-button" type="button" (click)="continueWithGoogle()" [disabled]="loading()">
        <svg class="auth-icon" aria-hidden="true" focusable="false"><use href="/icons/tabler-fitness.svg#brand-google"></use></svg>Google
      </button>
      <p class="auth-switch">¿Aún no tienes cuenta? <a routerLink="/signup">Crea tu cuenta</a></p>
    </section>
  </div>
</main>
