<main class="reset-page">
  <a class="brand-link" routerLink="/" aria-label="Volver al inicio">
    <img src="/brand/zummith-horizontal.svg" alt="Zummith" width="160" height="45">
  </a>

  <section class="reset-card surface-card" aria-labelledby="reset-title">
    <div class="reset-heading">
      <p class="page-kicker">Seguridad de la cuenta</p>
      <h1 id="reset-title">Crea una nueva contraseña.</h1>
      <p>Usa al menos ocho caracteres, con mayúscula, minúscula y número.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="new-password">Nueva contraseña</label>
        <div class="password-field">
          <input class="form-control" id="new-password" [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password" formControlName="password" placeholder="Mínimo 8 caracteres"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
          <button class="password-toggle" type="button" (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ showPassword() ? 'Ocultar' : 'Ver' }}
          </button>
          <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres, mayúscula, minúscula y número.</div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password-confirmation">Confirma la contraseña</label>
        <input class="form-control" id="password-confirmation" [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password" formControlName="confirmation"
          [class.is-invalid]="form.controls.confirmation.touched && form.controls.confirmation.invalid">
        <div class="invalid-feedback">Confirma tu nueva contraseña.</div>
      </div>

      <button class="btn btn-primary btn-lg w-100" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
        {{ loading() ? 'Guardando' : 'Guardar contraseña' }}
      </button>
    </form>

    <a class="back-link" routerLink="/login"><svg class="back-link-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="/icons/material-icons.svg#arrow-back"></use></svg> Volver al inicio de sesión</a>
  </section>
</main>
