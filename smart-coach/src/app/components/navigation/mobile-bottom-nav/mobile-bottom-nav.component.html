<nav class="mobile-bottom-nav">
    <a *ngFor="let item of navItems()" [routerLink]="item.route" class="nav-item"
        [class.highlighted]="item.isHighlighted" [class.active]="isActive(item.route)">
        <span class="nav-icon">
            <ng-container [ngSwitch]="item.iconKey">
                <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>
                <svg *ngSwitchCase="'routines'" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /><path d="M16 13H8" /><path d="M16 17H8" /><path d="M10 9H8" /></svg>
                <svg *ngSwitchCase="'measurements'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18" /><path d="M7 17V9" /><path d="M12 17V5" /><path d="M17 17v-6" /></svg>
                <svg *ngSwitchCase="'payments'" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" /><path d="M2 10h20" /></svg>
                <svg *ngSwitchCase="'clients'" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><path d="M20 8v6" /><path d="M23 11h-6" /></svg>
                <svg *ngSwitchCase="'staff'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4" /><path d="M2 21a7 7 0 0 1 14 0" /><path d="M17 8h6" /><path d="M20 5v6" /></svg>
                <svg *ngSwitchCase="'profile'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
                <svg *ngSwitchCase="'create'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
                <svg *ngSwitchCase="'exercises'" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9v6" /><path d="M18 9v6" /><path d="M4 10h4" /><path d="M16 10h4" /><path d="M4 14h4" /><path d="M16 14h4" /><path d="M8 12h8" /></svg>
                <svg *ngSwitchCase="'admin'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
            </ng-container>
        </span>
        <span class="nav-label">{{ item.label }}</span>
    </a>
</nav>
