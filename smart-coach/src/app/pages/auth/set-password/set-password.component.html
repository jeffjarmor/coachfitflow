<div class="set-password-container">
    <div class="set-password-card">
        <div class="set-password-header">
            <h1>Crear Contraseña</h1>
            <p>Define tu contraseña para acceder al portal de cliente</p>
        </div>

        <div class="state-message error" *ngIf="errorMessage()">
            {{ errorMessage() }}
        </div>
        <div class="state-message success" *ngIf="successMessage()">
            {{ successMessage() }}
        </div>

        <div class="loading-state" *ngIf="initializing()">
            Validando enlace...
        </div>

        <form *ngIf="!initializing() && !successMessage()" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input
                    id="password"
                    type="password"
                    formControlName="password"
                    placeholder="Mínimo 8 caracteres"
                />
                <div class="error-text" *ngIf="password?.invalid && password?.touched">
                    <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
                    <span *ngIf="password?.errors?.['minlength']">Mínimo 8 caracteres</span>
                    <span *ngIf="password?.errors?.['passwordComplexity']">Debe tener mayúscula, minúscula y número</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input
                    id="confirmPassword"
                    type="password"
                    formControlName="confirmPassword"
                    placeholder="Repite la contraseña"
                />
                <div class="error-text" *ngIf="form.errors?.['passwordMismatch'] && confirmPassword?.touched">
                    Las contraseñas no coinciden.
                </div>
            </div>

            <app-button type="submit" [loading]="loading()" [disabled]="form.invalid || loading()">
                Guardar contraseña
            </app-button>
        </form>

        <div class="helper-links">
            <a routerLink="/login">Volver al login</a>
        </div>
    </div>
</div>
